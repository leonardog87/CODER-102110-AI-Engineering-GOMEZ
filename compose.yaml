services:
  app:
    build:
      context: .
    image: chatbot:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHATBOT_DB: /app/data/chatBot.sqlite3
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - app-data:/app/data
      - ./repositorios:/app/repositorios

  api:
    build:
      context: .
    image: chatbot:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHATBOT_DB: /app/data/chatBot.sqlite3
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - app-data:/app/data
      - ./repositorios:/app/repositorios

volumes:
  app-data:
