services:
  app:
    build:
      context: .
    image: agente-corporativo-ia:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENTE_CORPORATIVO_DB: /app/data/agente_corporativo.sqlite3
      CHROMA_PERSIST_DIR: /app/manuales_complejos_chroma_db
      KNOWLEDGE_CHROMA_PERSIST_DIR: /app/manuales_simples_chroma_db
    ports:
      - "8501:8501"
    volumes:
      - app-data:/app/data
      - complex-chroma:/app/manuales_complejos_chroma_db
      - simple-chroma:/app/manuales_simples_chroma_db

volumes:
  app-data:
  complex-chroma:
  simple-chroma:
