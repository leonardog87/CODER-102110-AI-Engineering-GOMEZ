services:
  app:
    build:
      context: .
    image: agente-corporativo-ia:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENTE_CORPORATIVO_DB: /app/data/agente_corporativo.sqlite3
      CHROMA_PERSIST_DIR: /app/manuales_complejos_chroma_db
      KNOWLEDGE_CHROMA_PERSIST_DIR: /app/manuales_simples_chroma_db
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - app-data:/app/data
      - complex-chroma:/app/manuales_complejos_chroma_db
      - simple-chroma:/app/manuales_simples_chroma_db

  api:
    build:
      context: .
    image: agente-corporativo-ia:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENTE_CORPORATIVO_DB: /app/data/agente_corporativo.sqlite3
      CHROMA_PERSIST_DIR: /app/manuales_complejos_chroma_db
      KNOWLEDGE_CHROMA_PERSIST_DIR: /app/manuales_simples_chroma_db
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - complex-chroma:/app/manuales_complejos_chroma_db
      - simple-chroma:/app/manuales_simples_chroma_db

volumes:
  app-data:
  complex-chroma:
  simple-chroma:
