apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agente-corporativo-ia
  namespace: agente-corporativo-ia
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agente-corporativo-ia.example.com
      secretName: agente-corporativo-ia-tls
  rules:
    - host: agente-corporativo-ia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agente-corporativo-ia
                port:
                  name: http
