apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot
  namespace: chatbot
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chatbot.example.com
      secretName: chatbot-tls
  rules:
    - host: chatbot.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chatbot
                port:
                  name: api
          - path: /health
            pathType: Exact
            backend:
              service:
                name: chatbot
                port:
                  name: api
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: chatbot
                port:
                  name: api
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: chatbot
                port:
                  name: api
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatbot
                port:
                  name: http
