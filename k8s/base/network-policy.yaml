apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agente-corporativo-ia-ingress
  namespace: agente-corporativo-ia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agente-corporativo-ia
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agente-corporativo-ia
      ports:
        - protocol: TCP
          port: 8501
        - protocol: TCP
          port: 8000
