apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ciudad-analitica-ingress
  namespace: ciudad-analitica
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ciudad-analitica
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ciudad-analitica
      ports:
        - protocol: TCP
          port: 8501
