apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot-ingress
  namespace: chatbot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chatbot
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chatbot
      ports:
        - protocol: TCP
          port: 8501
