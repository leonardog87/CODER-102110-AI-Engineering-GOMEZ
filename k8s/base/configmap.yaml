apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: chatbot
data:
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: "proyecto_coder"
  OPENAI_API_BASE: ""
  OPENAI_MODEL: "qwen/qwen2.5-coder-14b"
  HF_MODEL_ID: ""
  LANGSMITH_TRAJECTORY_DATASET: "chatBot-trajectory"
  TRAJECTORY_JUDGE_MODEL: ""
  CHATBOT_DB: "/app/data/chatBot.sqlite3"
  AGENT_PROJECT_ROOT: "/app/repositorios/rrhh"
  PROJECT_INDEX_CHUNK_SIZE: "2400"
  PROJECT_INDEX_CHUNK_OVERLAP: "400"
  PROJECT_INDEX_TOP_K: "10"
  PROJECT_EDIT_TOP_K: "16"
  PROJECT_READER_MAX_CONTEXT_CHARS: "20000"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "1"
  API_CORS_ORIGINS: "http://localhost:3000;http://localhost:5173"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_PORT: "8501"
