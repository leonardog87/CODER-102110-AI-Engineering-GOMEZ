apiVersion: apps/v1
kind: Deployment
metadata:
  name: agente-corporativo-ia
  namespace: agente-corporativo-ia
  labels:
    app.kubernetes.io/name: agente-corporativo-ia
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agente-corporativo-ia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agente-corporativo-ia
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: agente-corporativo-ia
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: agente-corporativo-ia:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: agente-corporativo-ia-config
            - secretRef:
                name: agente-corporativo-ia-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: complex-chroma
              mountPath: /app/manuales_complejos_chroma_db
            - name: simple-chroma
              mountPath: /app/manuales_simples_chroma_db
            - name: tmp
              mountPath: /tmp
        - name: api
          image: agente-corporativo-ia:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: agente-corporativo-ia-config
            - secretRef:
                name: agente-corporativo-ia-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: complex-chroma
              mountPath: /app/manuales_complejos_chroma_db
            - name: simple-chroma
              mountPath: /app/manuales_simples_chroma_db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
        - name: complex-chroma
          persistentVolumeClaim:
            claimName: complex-chroma
        - name: simple-chroma
          persistentVolumeClaim:
            claimName: simple-chroma
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
